# AI 旅行手册 · 构建 + 推送 Docker 镜像到 GitHub Container Registry
# 触发：push 到 trae/agent-AIuofp 分支 或 手动 dispatch
# 镜像地址：ghcr.io/yunya1991/shandong-travel:latest
#          ghcr.io/yunya1991/shandong-travel:sha-<commit短>
name: Build and Push Docker Image

on:
  push:
    branches:
      - trae/agent-AIuofp
      - master
    paths-ignore:
      - 'README.md'
      - '.trae/**'
      - 'server/.dsh-home/**'
  workflow_dispatch:  # 手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 推送到 GHCR 必需

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # 自动提供，无需配置

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 安全：不把 secrets 当 build-args，避免泄露
